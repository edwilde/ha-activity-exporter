<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity Exporter harness</title>
<style>
  html { font-family: Roboto, sans-serif; }
  :root {
    --primary-color: #009ac7;
    --text-primary-color: #ffffff;
    --primary-text-color: #141414;
    --secondary-text-color: #5e5e5e;
    --card-background-color: #ffffff;
    --secondary-background-color: #e5e5e5;
    --primary-background-color: #fafafa;
    --divider-color: rgba(0, 0, 0, 0.12);
    --error-color: #db4437;
    --success-color: #43a047;
    --warning-color: #ffa600;
    --rgb-error-color: 219, 68, 55;
    --rgb-success-color: 67, 160, 71;
    --rgb-warning-color: 255, 166, 0;
    --ha-card-border-radius: 12px;
  }
  :root[data-theme="dark"] {
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b;
    --card-background-color: #1c1c1c;
    --secondary-background-color: #282828;
    --primary-background-color: #111111;
    --divider-color: rgba(225, 225, 225, 0.12);
  }
  body { margin: 0; background: var(--primary-background-color); }
</style>
</head>
<body>
<activity-exporter-panel id="panel"></activity-exporter-panel>
<script type="module">
  const params = new URLSearchParams(location.search);
  if (params.get("theme") === "dark") document.documentElement.dataset.theme = "dark";

  const fixedNow = Number(params.get("now"));
  if (Number.isFinite(fixedNow) && fixedNow > 0) Date.now = () => fixedNow;
  const now = Date.now() / 1000;
  const sunriseStart = now - 2 * 3600;
  const lights = {
    "light.bedroom_kitty_bedside_light": {
      friendly_name: "Bedside light",
      supported_color_modes: ["color_temp", "hs", "xy"],
      min_color_temp_kelvin: 2100, max_color_temp_kelvin: 6493, supported_features: 32,
    },
  };
  const states = {
    "light.bedroom_kitty_bedside_light": { state: "on", attributes: { ...lights["light.bedroom_kitty_bedside_light"], color_mode: "hs", brightness: 26, hs_color: [28.4, 65.7] } },
    "climate.lounge": { state: "heat", attributes: { friendly_name: "Lounge heat pump", hvac_modes: ["off", "heat", "cool"], min_temp: 7, max_temp: 35, current_temperature: 17.5, temperature: 21, hvac_action: "heating" } },
    "sensor.outdoor_temperature": { state: "-3.5", attributes: { friendly_name: "Outdoor temperature", unit_of_measurement: "°C", device_class: "temperature", state_class: "measurement" } },
    "binary_sensor.front_door": { state: "off", attributes: { friendly_name: "Front door", device_class: "door" } },
    "light.hall": { state: "on", attributes: { friendly_name: "Hall light", supported_color_modes: ["brightness"], color_mode: "brightness", brightness: 200 } },
    "sensor.chatty_meter": { state: "1", attributes: { friendly_name: "Chatty meter", unit_of_measurement: "W", state_class: "measurement" } },
    "sensor.garage_humidity": { state: "55", attributes: { friendly_name: "Garage humidity", unit_of_measurement: "%", device_class: "humidity", state_class: "measurement" } },
  };
  const manyCount = Number(params.get("many")) || 0;
  const rowsEach = Number(params.get("rows")) || 50;
  for (let n = 1; n <= manyCount; n++) {
    states[`sensor.extra_${String(n).padStart(2, "0")}`] = { state: "1", attributes: { friendly_name: `Extra sensor ${n}`, unit_of_measurement: "W", state_class: "measurement" } };
  }

  function lerp(a, b, t) { return a + (b - a) * t; }
  function bedsideRows() {
    const caps = lights["light.bedroom_kitty_bedside_light"];
    const rows = [{ s: "off", a: { ...caps, color_mode: null, brightness: null, hs_color: null }, lu: sunriseStart - 3600 }];
    const cues = [[0, [12, 100], 3], [25, [345, 70], 15], [35, [42, 90], 20], [45, [28.4, 65.7], 26]];
    const onAt = sunriseStart;
    for (let step = 0; step <= 90; step++) {
      const minute = step / 2;
      let i = cues.findIndex((c, k) => k < cues.length - 1 && minute >= c[0] && minute < cues[k + 1][0]);
      if (i < 0) i = cues.length - 2;
      const [m0, hs0, b0] = cues[i];
      const [m1, hs1, b1] = cues[i + 1];
      const t = (minute - m0) / (m1 - m0);
      const lu = onAt + step * 30;
      const row = {
        s: "on",
        a: { ...caps, color_mode: "hs", brightness: Math.round(lerp(b0, b1, t)), hs_color: [+lerp(hs0[0], hs1[0], t).toFixed(3), +lerp(hs0[1], hs1[1], t).toFixed(3)] },
        lu,
      };
      if (step > 0) row.lc = onAt;
      rows.push(row);
    }
    return rows;
  }
  const history = {
    "light.bedroom_kitty_bedside_light": bedsideRows(),
    "climate.lounge": [0, 1, 2, 3].map((k) => ({ s: "heat", a: { ...states["climate.lounge"].attributes, current_temperature: 16 + k, hvac_action: k < 3 ? "heating" : "idle" }, lu: now - 5000 + k * 900, ...(k ? { lc: now - 5000 } : {}) })),
    "sensor.outdoor_temperature": [0, 1, 2].map((k) => ({ s: String(-3.5 + k), a: states["sensor.outdoor_temperature"].attributes, lu: now - 4000 + k * 600 })),
    "binary_sensor.front_door": [0, 1].map((k) => ({ s: k ? "off" : "on", a: states["binary_sensor.front_door"].attributes, lu: now - 3000 + k * 60 })),
    "sensor.chatty_meter": ["1", "1", "1", "2", "2", "3"].map((v, k) => ({ s: v, a: states["sensor.chatty_meter"].attributes, lu: now - 3500 + k * 300 })),
    "light.hall": [0, 1, 2].map((k) => ({ s: "on", a: { ...states["light.hall"].attributes, brightness: 100 + k * 50 }, lu: now - 4500 + k * 600, ...(k ? { lc: now - 4500 } : {}) })),
  };
  for (const id of Object.keys(states)) {
    if (!id.startsWith("sensor.extra_")) continue;
    history[id] = Array.from({ length: rowsEach }, (_, k) => ({ s: String(k), a: states[id].attributes, lu: now - 80000 + k * (80000 / rowsEach) }));
  }
  const logbook = [
    { when: sunriseStart, state: "on", entity_id: "light.bedroom_kitty_bedside_light", context_event_type: "script_started", context_domain: "script", context_name: "Weekend sunrise", context_message: "started", context_entity_id: "script.weekend_sunrise" },
  ];

  window.__calls = [];
  window.__fail = params.get("fail");
  window.__delay = Number(params.get("delay")) || 0;
  window.__exports = [];
  const realCreate = URL.createObjectURL;
  URL.createObjectURL = (blob) => { blob.text().then((t) => window.__exports.push(t)); return realCreate(blob); };

  const hass = {
    states,
    config: { time_zone: "Pacific/Auckland" },
    async callWS(msg) {
      window.__calls.push(msg);
      const start = Date.parse(msg.start_time) / 1000;
      const end = Date.parse(msg.end_time) / 1000;
      if (window.__delay) await new Promise((resolve) => setTimeout(resolve, window.__delay));
      if (window.__fail === msg.type) throw new Error("mock failure");
      if (msg.type === "history/history_during_period") {
        const result = {};
        for (const id of msg.entity_ids) {
          const rows = (history[id] || []).filter((r) => r.lu >= start && r.lu < end);
          if (rows.length) result[id] = rows;
        }
        return result;
      }
      if (msg.type === "logbook/get_events") {
        return logbook.filter((e) => msg.entity_ids.includes(e.entity_id) && e.when >= start && e.when < end);
      }
      throw new Error(`unknown ${msg.type}`);
    },
  };

  if (params.get("picker") === "1") {
    class StubEntityPicker extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: "open" });
        this._value = "";
        this._hass = null;
        this._exclude = [];
        this._label = "";
        this.shadowRoot.innerHTML = `<style>select { width: 100%; box-sizing: border-box; padding: 12px; font: inherit; border: 1px solid var(--divider-color); border-radius: 8px; background: var(--secondary-background-color); color: var(--primary-text-color); }</style><select></select>`;
        this._select = this.shadowRoot.querySelector("select");
        this._select.addEventListener("change", () => {
          this._value = this._select.value;
          this.dispatchEvent(new CustomEvent("value-changed", { detail: { value: this._value }, bubbles: true, composed: true }));
        });
      }
      set hass(hass) { this._hass = hass; this._render(); }
      get hass() { return this._hass; }
      set value(v) { this._value = v || ""; this._render(); }
      get value() { return this._value; }
      set label(v) { this._label = v; this._select.setAttribute("aria-label", v || ""); }
      get label() { return this._label; }
      set excludeEntities(v) { this._exclude = v || []; this._render(); }
      get excludeEntities() { return this._exclude; }
      _render() {
        if (!this._hass) return;
        const ids = Object.keys(this._hass.states).filter((id) => id === this._value || !this._exclude.includes(id)).sort();
        this._select.innerHTML = `<option value=""></option>` + ids.map((id) => `<option value="${id}">${this._hass.states[id].attributes.friendly_name || id}</option>`).join("");
        this._select.value = this._value;
      }
    }
    customElements.define("ha-entity-picker", StubEntityPicker);
  }

  await import("/custom_components/ha_activity_exporter/frontend/activity-exporter-panel.js");
  const panel = document.getElementById("panel");
  panel.narrow = params.get("narrow") === "1";
  panel.hass = hass;
  window.__hass = hass;
</script>
</body>
</html>
