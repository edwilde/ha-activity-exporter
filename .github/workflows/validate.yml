name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # The brand assets live in home-assistant/brands, submitted separately
          # from this repo, so skip that check until they are published.
          ignore: brands

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run pure-function tests
        run: node --test tests/frontend/*.test.mjs

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          # The frontend integration needs its asset package (hass_frontend),
          # which the test helper does not pull in. Install the exact version
          # Home Assistant core pins so it always matches.
          CONSTRAINTS="$(python -c 'import os, homeassistant; print(os.path.join(os.path.dirname(homeassistant.__file__), "package_constraints.txt"))')"
          pip install -c "$CONSTRAINTS" home-assistant-frontend
      - name: Run pytest
        run: pytest
